<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5队篮球单循环抽签赛程程序</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2933; --muted:#6b7280;
    --line:#e3e8f0; --brand:#e8502e; --brand2:#2b6cb0; --ok:#2f9e44;
    --shadow:0 6px 18px rgba(31,41,51,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    line-height:1.55;padding:20px;max-width:960px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  h2{font-size:17px;margin:24px 0 10px;border-left:4px solid var(--brand);padding-left:10px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:6px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;box-shadow:var(--shadow);margin-bottom:18px}
  .teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  input[type=text]{width:100%;padding:9px 11px;border:1px solid var(--line);
    border-radius:9px;font-size:14px;background:#fff;color:var(--ink)}
  input[type=text]:focus{outline:none;border-color:var(--brand2)}
  .draw-wrap{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
  .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;flex:1;min-width:280px}
  .card{aspect-ratio:3/4;border-radius:12px;cursor:pointer;position:relative;
    perspective:800px;user-select:none;transition:transform .15s}
  .card:hover{transform:translateY(-3px)}
  .card .face{position:absolute;inset:0;border-radius:12px;display:flex;
    align-items:center;justify-content:center;backface-visibility:hidden;
    transition:transform .5s;font-weight:800;font-size:30px}
  .card .back{background:linear-gradient(135deg,#e8502e,#ff8a5c);color:#fff;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
  .card .front{background:#fff;border:2px solid var(--line);color:var(--brand);
    transform:rotateY(180deg)}
  .card.flipped .back{transform:rotateY(180deg)}
  .card.flipped .front{transform:rotateY(0)}
  .card.used{opacity:.45;pointer-events:none}
  .card .tag{position:absolute;top:6px;left:0;right:0;text-align:center;
    font-size:11px;color:var(--muted);font-weight:600}
  .side{flex:1;min-width:240px}
  select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;
    width:100%;font-size:14px;background:#fff;color:var(--ink)}
  .btn{display:inline-block;border:none;border-radius:9px;padding:9px 14px;
    font-size:14px;font-weight:600;cursor:pointer;color:#fff;background:var(--brand2);
    margin-top:10px}
  .btn.ghost{background:#fff;color:var(--brand2);border:1px solid var(--brand2)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .log{margin-top:12px;font-size:13px;background:#f8fafc;border:1px dashed var(--line);
    border-radius:9px;padding:10px 12px;min-height:40px;color:var(--muted)}
  .log b{color:var(--ink)}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
  th,td{border:1px solid var(--line);padding:10px 8px;text-align:center}
  th{background:#f1f5f9;color:#334155;font-weight:700}
  tr:nth-child(even) td{background:#fafbfc}
  .rest{color:var(--brand);font-weight:700}
  .muted{color:var(--muted);font-size:13px}
  .schedule{display:none}
  .badge{display:inline-block;background:var(--ok);color:#fff;border-radius:20px;
    padding:2px 10px;font-size:12px;font-weight:700}
  @media print{
    body{background:#fff}
    .panel{box-shadow:none;border:none;padding:0}
    .noprint{display:none!important}
    .schedule{display:block}
  }
</style>
</head>
<body>
  <h1>🏀 5队篮球单循环 · 抽签赛程程序</h1>
  <div class="sub">FIBA 国际篮联规则单循环编排 · 5队 × 10场 · 每天2场 × 5天 · 队长自行抽签定位</div>

  <div class="panel noprint">
    <h2>第 1 步 · 填写 5 支球队名称</h2>
    <div class="teams" id="teamInputs"></div>
    <button class="btn ghost" onclick="resetTeams()">恢复默认队名</button>
  </div>

  <div class="panel">
    <h2>第 2 步 · 队长抽签定位 <span class="badge" id="drawCount">0 / 5</span></h2>
    <div class="sub">每位队长先在右侧选择自己的队名，再点一张翻开的卡片，卡片上的数字即为本队“定位号”(1–5)。5位队长抽完即生成赛程。</div>
    <div class="draw-wrap" style="margin-top:12px">
      <div class="cards" id="cards"></div>
      <div class="side">
        <label class="muted">当前抽签队长：</label>
        <select id="picker"></select>
        <div class="log" id="log">等待抽签…</div>
        <button class="btn ghost" onclick="reshuffle()">🔀 重新洗牌</button>
        <button class="btn ghost" onclick="resetDraw()">↺ 重置抽签</button>
      </div>
    </div>
  </div>

  <div class="panel schedule" id="schedulePanel">
    <h2>第 3 步 · 循环赛程表（自动生成）</h2>
    <div class="sub">编排方式：国际篮联单循环轮转法（贝格尔轮转）。每天 2 场，1 队轮空，5 天每队恰好轮空 1 次。</div>
    <div id="scheduleOut"></div>
    <button class="btn noprint" onclick="window.print()">🖨 打印 / 导出赛程</button>
  </div>

<script>
  let teams = ["红队","蓝队","黄队","绿队","黑队"];
  let cards = [];          // 卡片上的隐藏数字（1-5 打乱）
  let drawn = {};          // teamName -> position
  let flipped = new Set(); // 已翻开的卡片索引  

  function init(){
    renderTeamInputs();
    reshuffle();
  }

  function renderTeamInputs(){
    const box = document.getElementById("teamInputs");
    box.innerHTML = "";
    teams.forEach((t,i)=>{
      const d = document.createElement("div");
      d.innerHTML = `<input type="text" value="${t}" data-i="${i}" onchange="teams[${i}]=this.value">`;
      box.appendChild(d);
    });
  }
  function resetTeams(){
    teams = ["红队","蓝队","黄队","绿队","黑队"];
    renderTeamInputs();
  }

  function reshuffle(){
    // 生成 1-5 并洗牌
    cards = [1,2,3,4,5].sort(()=>Math.random()-0.5);
    drawn = {}; flipped = new Set();
    renderCards(); renderPicker(); updateLog("已洗牌，请队长依次抽签。");
  }
  function resetDraw(){
    drawn = {}; flipped = new Set();
    renderCards(); renderPicker(); updateLog("抽签已重置。");
    document.getElementById("schedulePanel").style.display = "none";
  }

  function renderCards(){
    const c = document.getElementById("cards");
    c.innerHTML = "";
    cards.forEach((num,i)=>{
      const used = drawn[Object.keys(drawn).find(k=>drawn[k]===num)] !== undefined && flipped.has(i);
      const div = document.createElement("div");
      const isUsed = flipped.has(i);
      div.className = "card" + (isUsed?" flipped used":"");
      const label = isUsed ? Object.keys(drawn).find(k=>drawn[k]===num) : "";
      div.innerHTML = `
        <div class="face back">?</div>
        <div class="face front">${num}<div class="tag">${label}</div></div>`;
      if(!isUsed){
        div.onclick = ()=>drawCard(i);
      }
      c.appendChild(div);
    });
  }

  function renderPicker(){
    const sel = document.getElementById("picker");
    sel.innerHTML = "";
    teams.filter(t=>!drawn[t]).forEach(t=>{
      const o = document.createElement("option");
      o.value = t; o.textContent = t;
      sel.appendChild(o);
    });
    if(sel.options.length===0) sel.innerHTML = "<option>已全部抽完</option>";
  }

  function drawCard(i){
    if(flipped.has(i)) return;
    const sel = document.getElementById("picker");
    const team = sel.value;
    if(!team || drawn[team]!==undefined) return;
    const num = cards[i];
    drawn[team] = num;
    flipped.add(i);
    renderCards(); renderPicker();
    updateLog(`<b>${team}</b> 抽到定位号 <b>${num}</b>。`);
    document.getElementById("drawCount").textContent = Object.keys(drawn).length + " / 5";
    if(Object.keys(drawn).length===5){
      updateLog("🎉 5 位队长已全部抽签完毕，赛程已生成 ↓");
      buildSchedule();
    }
  }

  function updateLog(html){ document.getElementById("log").innerHTML = html; }

  // 国际篮联单循环轮转法（圆圈轮转 / 贝格尔轮转）：5队+1虚拟轮空=6位
  function buildSchedule(){
    const posToTeam = {}; // 定位号 -> 队名
    Object.keys(drawn).forEach(t=> posToTeam[drawn[t]] = t);
    const N = 6;                 // 5队 + 虚拟轮空位(6)
    let arr = [1,2,3,4,5,6];
    const days = [];
    for(let r=0;r<5;r++){
      const matches = []; let bye = null;
      for(let i=0;i<3;i++){
        const a = arr[i], b = arr[N-1-i];
        if(a===6) bye = posToTeam[b];
        else if(b===6) bye = posToTeam[a];
        else matches.push([posToTeam[a], posToTeam[b]]);
      }
      days.push({matches, bye});
      // 轮转：固定 arr[0]，末位移至第2位
      const last = arr[N-1];
      for(let i=N-1;i>1;i--) arr[i]=arr[i-1];
      arr[1]=last;
    }
    renderSchedule(days);
  }

  function renderSchedule(days){
    let html = `<table><thead><tr><th>比赛日</th><th>第 1 场</th><th>第 2 场</th><th>轮空（休息）</th></tr></thead><tbody>`;
    days.forEach((d,idx)=>{
      html += `<tr><td><b>第 ${idx+1} 天</b></td>
        <td>${d.matches[0][0]} <span class="muted">VS</span> ${d.matches[0][1]}</td>
        <td>${d.matches[1][0]} <span class="muted">VS</span> ${d.matches[1][1]}</td>
        <td class="rest">${d.bye}</td></tr>`;
    });
    html += `</tbody></table>
      <div class="muted" style="margin-top:10px">说明：单循环共 10 场，每队打 8 场、轮空 1 场；同一天内两场对阵互不重复，符合 FIBA 单循环编排规则。</div>`;
    document.getElementById("scheduleOut").innerHTML = html;
    document.getElementById("schedulePanel").style.display = "block";
  }

  init();
</script>
</body>
</html>
